<!-- WHAT WE OFFER — trust badges section (self-contained: inline CSS + SVG, no images needed).
     Paste into a Custom HTML / Custom Liquid block. Desktop: 4 columns · Tablet/Mobile: 2 columns · Very small: 1 column. -->
<section class="wwo-section">
  <style>
    .wwo-section{padding:36px 16px;font-family:inherit;color:#1c1c1c}
    .wwo-head{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto 30px}
    .wwo-head::before,.wwo-head::after{content:"";flex:1;height:1px;background:#e3e3e3}
    .wwo-title{font-size:26px;font-weight:800;letter-spacing:.5px;color:#f68b1e;text-transform:uppercase;white-space:nowrap;margin:0}
    .wwo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px;max-width:1200px;margin:0 auto}
    .wwo-item{text-align:center;padding:0 8px}
    .wwo-icon{width:70px;height:70px;margin:0 auto 18px;display:block}
    .wwo-icon svg{width:100%;height:100%;display:block}
    .wwo-item h3{font-size:19px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin:0 0 10px;color:#1c1c1c}
    .wwo-item p{font-size:15px;line-height:1.6;color:#333;margin:0}
    @media (max-width:900px){
      .wwo-grid{grid-template-columns:repeat(2,1fr);gap:26px 14px}
      .wwo-title{font-size:22px}
      .wwo-icon{width:58px;height:58px;margin-bottom:12px}
      .wwo-item h3{font-size:16px}
      .wwo-item p{font-size:13.5px}
    }
    @media (max-width:400px){
      .wwo-grid{grid-template-columns:1fr}
    }
  </style>
