<!-- ============================================================================
  FUSION · ShopBase Widget v2 (v409) — GỘP 2 widget làm 1:
    • Estimated delivery: "Delivery to 🇺🇸 United States … Ordered → Shipped → Delivered"
    • Customize: ô Color / text khách tự chọn phía trên Add to cart (đi vào order properties)

  KHÁC BẢN CŨ: KHÔNG đọc dữ liệu nhúng trong mô tả nữa (ShopBase sanitize mất) —
  widget GỌI THẲNG VỀ FUSION theo handle sản phẩm. Sửa template trong FUSION là
  storefront đổi theo, không cần push lại sản phẩm.

  CÀI ĐẶT: Online Store → Design → Customize → Settings → General → Additional scripts
  → XOÁ 2 đoạn widget cũ (nếu đã dán) → dán TOÀN BỘ file này vào ô HEAD → Save.
============================================================================ -->
<style>
  .fsd-wrap{font-family:inherit;border-bottom:1px solid #e8e8ee;padding:6px 0 18px;background:transparent}
  .fsd-acc-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:16px 0 12px;user-select:none}
  .fsd-acc-title{font-weight:700;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;color:#0C0A1F}
  .fsd-acc-chev{transition:transform .18s;color:#0C0A1F}
  .fsd-wrap.fsd-closed .fsd-acc-chev{transform:rotate(-180deg)}
  .fsd-wrap.fsd-closed .fsd-acc-body{display:none}
  .fsd-wrap.fsd-closed{padding-bottom:6px}
  .fsd-head{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .fsd-title{font-weight:700;font-size:15px;margin:0;display:flex;align-items:center;gap:6px}
  .fsd-select{width:auto;min-width:150px;padding:6px 28px 6px 10px;border:1px solid #d9dee7;border-radius:8px;font-size:14.5px;font-weight:700;background:#fff;appearance:auto;color:#0C0A1F;font-family:inherit}
  .fsd-line{font-size:14px;margin:2px 0 16px;color:#333}
  .fsd-line b{font-weight:700;color:#111}
  .fsd-steps{display:flex;align-items:flex-start;position:relative;margin:4px 0 2px}
  .fsd-step{flex:1;text-align:center;position:relative;z-index:1}
  .fsd-ic{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid #E6EAF3;box-shadow:0 1px 5px rgba(20,40,80,.10);display:inline-flex;align-items:center;justify-content:center;color:#1d4a8f}
  .fsd-ic svg{width:22px;height:22px}
  .fsd-step-label{font-weight:700;font-size:13px;margin-top:7px}
  .fsd-step-date{font-size:12px;color:#555;margin-top:2px}
  .fsd-bar{position:absolute;top:24px;left:14%;right:14%;height:3px;background:linear-gradient(90deg,#c9d6f2,#dbe3f3);border-radius:2px;z-index:0}
  @media (max-width:480px){.fsd-wrap{padding:14px 12px 12px}.fsd-ic{width:42px;height:42px}.fsd-ic svg{width:19px;height:19px}}
  .fcz-wrap{margin:14px 0;font-family:inherit}
  .fcz-field{margin-bottom:12px}
  .fcz-label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
  .fcz-label .fcz-req{color:#d33;margin-left:2px}
  .fcz-input,.fcz-select{width:100%;padding:10px 12px;border:1px solid #d9dee7;border-radius:8px;font-size:14px;background:#fff;box-sizing:border-box}
  .fcz-error{color:#d33;font-size:12.5px;margin-top:4px;display:none}
  .fcz-label .fcz-val{font-weight:600}
  .fcz-pills{display:flex;flex-wrap:wrap;gap:10px}
  .fcz-pill{border:1px solid #d9dee7;background:#fff;color:#1a1a2e;border-radius:999px;padding:10px 18px;font-size:14px;font-family:inherit;cursor:pointer;line-height:1;transition:all .12s}
  .fcz-pill:hover{border-color:#9aa7bd}
  .fcz-pill.on{background:#1e1b4b;border-color:#1e1b4b;color:#fff;font-weight:600}
  /* v422 · Bo tròn góc ảnh — mockup gallery trang sản phẩm + product card homepage/collection.
     Áp cho mọi <img> của theme; radius tự giới hạn theo kích thước với ảnh nhỏ.
     Cờ quốc gia trong widget có style inline riêng nên không bị ảnh hưởng. */
  img{border-radius:14px}
  @media (max-width:480px){img{border-radius:10px}}
</style>
<script>
(function () {
  "use strict";
  var FUSION_BASE = "https://os.fusiondn.com";   // đổi nếu FUSION chạy domain khác

  // Số mặc định khi FUSION không có cấu hình cho sản phẩm này (sản phẩm cũ, không template).
  var DEFAULT_DELIVERY = {
    proc: [1, 3], us: [4, 8], intl: [10, 30], cutoff: 14,
    countries: { ca: [6, 12], gb: [7, 14], au: [8, 16], de: [7, 14] }
  };

  // Windows không render emoji cờ (hiện thành chữ "us") → dùng ảnh cờ flagcdn (~1KB, mọi OS đều hiện).
  var COUNTRY_META = [
    { key: "us",   iso: "us", label: "United States" },
    { key: "ca",   iso: "ca", label: "Canada" },
    { key: "gb",   iso: "gb", label: "United Kingdom" },
    { key: "au",   iso: "au", label: "Australia" },
    { key: "de",   iso: "de", label: "Germany" },
    { key: "intl", iso: "un", label: "Rest of world" }
  ];
  function flagImg(iso) {
    return '<img src="https://flagcdn.com/w20/' + iso + '.png" srcset="https://flagcdn.com/w40/' + iso + '.png 2x" width="20" alt="" style="vertical-align:-2px;border-radius:2px;margin:0 2px">';
  }

  function bd(from, n) {
    var d = new Date(from.getTime()), left = n;
    while (left > 0) { d.setDate(d.getDate() + 1); var w = d.getDay(); if (w !== 0 && w !== 6) left--; }
    return d;
  }
  function fmt(d) { return d.toLocaleDateString("en-US", { month: "short", day: "2-digit" }); }
  function transitFor(cfg, key) {
    if (key === "us") return cfg.us || cfg.intl || [10, 30];
    if (key === "intl") return cfg.intl || [10, 30];
    return (cfg.countries || {})[key] || cfg.intl || [10, 30];
  }

  function log() { try { console.log.apply(console, ["[FUSION]"].concat([].slice.call(arguments))); } catch (e) {} }
  // Nút phải ĐANG HIỂN THỊ — theme thường có thêm 1 nút Add to cart trong thanh sticky/mobile
  // đang ẩn; chèn vào đó là widget "tàng hình". Chỉ nhận nút có kích thước thật trên màn hình.
  function isVisible(el) {
    if (!el || !el.getBoundingClientRect) return false;
    var r = el.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return false;
    var st = window.getComputedStyle(el);
    return st.display !== "none" && st.visibility !== "hidden" && st.opacity !== "0";
  }
  function pickVisible(list) {
    for (var i = 0; i < list.length; i++) if (isVisible(list[i])) return list[i];
    return list[0] || null;
  }
  function findBuyBox() {
    // Nhận cả theme cũ lẫn Website Builder — gom TẤT CẢ ứng viên rồi ưu tiên nút đang hiển thị.
    var cands = [].slice.call(document.querySelectorAll(
      'button[name="add"], .btn-add-cart, .btn-addtocart, [class*="add-to-cart"], [class*="add_to_cart"], [class*="add-cart"], [class*="addcart"], [class*="AddToCart"], [data-testid*="add-to-cart"], .product-form button[type="submit"], form[action*="/cart"] button'
    ));
    var all = document.querySelectorAll("button");
    for (var i = 0; i < all.length; i++) {
      var t = (all[i].textContent || "").trim().toLowerCase();
      if (t === "add to cart" || t === "add to bag" || t.indexOf("add to cart") === 0) cands.push(all[i]);
    }
    var btn = pickVisible(cands);
    var form = btn ? btn.closest("form") : null;
    if (!form) form = document.querySelector('form[action*="/cart"], .product-form form, form.product-form');
    return { form: form, btn: btn };
  }
  // Tìm NGUYÊN KHỐI accordion info (chứa cả PRODUCT DETAILS + SHIPPING + RETURN) —
  // chèn widget TRƯỚC cả khối (cùng cấp section) chứ không chen giữa các mục bên trong
  // (chen giữa là React của theme so le danh sách → nhân bản như lần trước).
  function findInfoSection() {
    var heads = document.querySelectorAll("h1,h2,h3,h4,h5,h6,button,span,div,p,summary");
    var head = null;
    for (var i = 0; i < heads.length; i++) {
      var t = (heads[i].textContent || "").trim();
      if (t.length < 40 && /^product details$/i.test(t)) head = heads[i];   // match sâu nhất
    }
    if (!head || !isVisible(head)) return null;
    // Leo lên tới element ĐẦU TIÊN có đủ cả 3 heading → đó là container accordion.
    var node = head, container = null;
    for (var up = 0; up < 8 && node; up++) {
      var txt = (node.textContent || "").toLowerCase();
      if (txt.indexOf("product details") !== -1 && txt.indexOf("shipping") !== -1 && txt.indexOf("return") !== -1) { container = node; break; }
      node = node.parentElement;
    }
    if (!container) return null;
    // Nếu cha chỉ là wrapper bọc đúng nội dung này thì leo thêm (ra tới section độc lập).
    while (container.parentElement && container.parentElement !== document.body &&
           (container.parentElement.textContent || "").trim() === (container.textContent || "").trim()) {
      container = container.parentElement;
    }
    return container;
  }
  function findBuyNow() {
    // Lấy nút Buy now CUỐI CÙNG đang hiển thị → widget nằm dưới nó, ngay trên PRODUCT DETAILS.
    var all = document.querySelectorAll("button, a");
    var hit = null;
    for (var i = 0; i < all.length; i++) {
      var t = (all[i].textContent || "").trim().toLowerCase();
      if ((t === "buy now" || t === "buy it now") && isVisible(all[i])) hit = all[i];
    }
    return hit;
  }
  function findDescription() {
    return document.querySelector('.product__description, .product-description, [class*="product"][class*="description"], [class*="wb-"][class*="description"], .prod-desc, #product-description');
  }
  // Khối text tĩnh "🚚 Estimated delivery" trong mô tả (fallback khi chưa cài widget) → ẩn đi.
  function hideFallbackText() {
    var els = document.querySelectorAll("p, div");
    for (var i = 0; i < els.length; i++) {
      var t = (els[i].textContent || "").trim();
      if (t.indexOf("Estimated delivery") === 0 || t.indexOf("🚚 Estimated delivery") === 0) {
        if (t.length < 400) els[i].style.display = "none";
      }
    }
  }

  // ── Info tabs — đổ nội dung template vào panel accordion SHIPPING / RETURN & WARRANTY ──
  function fillTabs(tabs) {
    if (!tabs) return;
    var jobs = [
      { re: /^shipping$/i, html: tabs.shipping, key: "shipping" },
      { re: /^return\s*&\s*warranty$/i, html: tabs.returnWarranty, key: "returnWarranty" }
    ];
    jobs.forEach(function (job) {
      if (!job.html) return;
      if (document.querySelector('[data-fusion-tab="' + job.key + '"]')) return;   // đã đổ rồi
      // Tìm heading NHỎ NHẤT khớp đúng text (deepest match) trong các thẻ tiêu đề thường gặp.
      var heads = document.querySelectorAll("h1,h2,h3,h4,h5,h6,button,span,div,p,summary");
      var head = null;
      for (var i = 0; i < heads.length; i++) {
        var t = (heads[i].textContent || "").trim();
        if (t.length < 40 && job.re.test(t)) head = heads[i];   // lấy match sâu nhất (duyệt sau cùng)
      }
      if (!head) { log("tab '" + job.key + "': heading not found"); return; }
      // Panel = sibling kế tiếp có nội dung, dò từ heading đi lên tối đa 4 cấp.
      var node = head, panel = null;
      for (var up = 0; up < 4 && node && !panel; up++) {
        var sib = node.nextElementSibling;
        while (sib) {
          var txt = (sib.textContent || "").trim();
          if (txt.length > 10 || sib.children.length) { panel = sib; break; }
          sib = sib.nextElementSibling;
        }
        node = node.parentElement;
      }
      if (!panel) { log("tab '" + job.key + "': panel not found"); return; }
      panel.innerHTML = '<div data-fusion-tab="' + job.key + '" style="padding:6px 0;line-height:1.65;font-size:14px">' + job.html + "</div>";
      log("tab '" + job.key + "': filled");
    });
  }

  // ── Customize fields (Color, tên khắc…) — chèn trước Add to cart, ghi vào properties[] ──
  function renderCustomize(fields) {
    if (!fields || !fields.length) return;
    var existing = document.querySelector(".fcz-wrap");
    if (existing) {
      if (isVisible(existing)) return;
      existing.parentNode.removeChild(existing);   // đã chèn vào khu ẩn → chèn lại chỗ hiển thị
      log("customize: re-inserting (was in a hidden container)");
    }
    var target = findBuyBox();
    if (!target.form && !target.btn) { log("customize: add-to-cart button/form not found yet"); return; }
    var wrap = document.createElement("div");
    wrap.className = "fcz-wrap";
    fields.slice(0, 5).forEach(function (f) {
      var label = String(f.label || "").slice(0, 45);
      if (!label) return;
      var field = document.createElement("div");
      field.className = "fcz-field";
      var lab = document.createElement("label");
      lab.className = "fcz-label";
      lab.textContent = label;
      var isPills = f.type === "dropdown" && Array.isArray(f.options) && f.options.length;
      if (f.required && !isPills) { var r = document.createElement("span"); r.className = "fcz-req"; r.textContent = "*"; lab.appendChild(r); }
      field.appendChild(lab);
      var input;
      if (f.type === "dropdown" && Array.isArray(f.options) && f.options.length) {
        // Pill buttons — giống hệt variant picker Styles/Size của theme.
        lab.textContent = label + ": ";
        var val = document.createElement("span");
        val.className = "fcz-val";
        lab.appendChild(val);
        if (f.required) { var r2 = document.createElement("span"); r2.className = "fcz-req"; r2.textContent = "*"; lab.appendChild(r2); }
        input = document.createElement("input");
        input.type = "hidden";
        var pills = document.createElement("div");
        pills.className = "fcz-pills";
        f.options.forEach(function (o) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "fcz-pill";
          btn.textContent = String(o);
          btn.addEventListener("click", function () {
            input.value = String(o);
            val.textContent = String(o);
            pills.querySelectorAll(".fcz-pill").forEach(function (b) { b.classList.remove("on"); });
            btn.classList.add("on");
            var err = field.querySelector(".fcz-error");
            if (err) err.style.display = "none";
          });
          pills.appendChild(btn);
        });
        field.appendChild(pills);
      } else {
        input = document.createElement("input");
        input.className = "fcz-input";
        input.type = "text";
        input.placeholder = label;
        if (f.maxChars) input.maxLength = Number(f.maxChars) || 100;
      }
      input.name = "properties[" + label + "]";
      input.setAttribute("data-fcz-required", f.required ? "1" : "");
      field.appendChild(input);
      var err = document.createElement("div");
      err.className = "fcz-error";
      err.textContent = "Please " + (f.type === "dropdown" ? "select" : "enter") + " " + label + " before adding to cart.";
      field.appendChild(err);
      wrap.appendChild(field);
    });
    if (!wrap.children.length) return;
    if (target.btn && target.btn.parentNode) target.btn.parentNode.insertBefore(wrap, target.btn);
    else target.form.insertBefore(wrap, target.form.firstChild);
    var guard = function (e) {
      var ok = true;
      wrap.querySelectorAll('[data-fcz-required="1"]').forEach(function (inp) {
        var bad = !String(inp.value || "").trim();
        var err = inp.parentNode.querySelector(".fcz-error");
        if (err) err.style.display = bad ? "block" : "none";
        if (bad) ok = false;
      });
      if (!ok) { e.preventDefault(); e.stopPropagation(); wrap.scrollIntoView({ behavior: "smooth", block: "center" }); }
    };
    if (target.btn) target.btn.addEventListener("click", guard, true);
    if (target.form) target.form.addEventListener("submit", guard, true);
  }

  // ── Delivery widget — timeline Ordered/Shipped/Delivered ──
  function renderDelivery(cfg) {
    if (document.querySelector(".fsd-wrap")) return;
    // Vị trí CHỐT: TRƯỚC nguyên khối accordion PRODUCT DETAILS (tức dưới toàn bộ khu mua hàng).
    // Fallback: sau khối chứa Buy now → mô tả → buy box → h1.
    var infoSec = findInfoSection();
    var anchor = null, mode = "after";
    if (infoSec) { anchor = infoSec; mode = "before"; }
    if (!anchor) {
      anchor = findBuyNow();
      if (anchor) {
        var node = anchor;
        for (var up = 0; up < 6 && node.parentElement && node.parentElement !== document.body; up++) {
          var pw = node.parentElement.getBoundingClientRect().width;
          var nw = node.getBoundingClientRect().width;
          if (pw > 0 && nw >= pw * 0.85) break;
          node = node.parentElement;
        }
        anchor = node;
      }
    }
    if (!anchor) { anchor = findDescription(); if (anchor && !isVisible(anchor)) anchor = null; }
    if (!anchor) { var bb = findBuyBox(); anchor = bb.btn ? bb.btn.parentNode : bb.form; }
    if (!anchor) { var h1 = document.querySelector("h1"); anchor = h1 ? h1.parentNode : null; }
    if (!anchor) { log("delivery: no anchor found (details/buynow/description/buybox/h1 all missing)"); return; }
    var wrap = document.createElement("div");
    wrap.className = "fsd-wrap";
    // Accordion row đồng bộ theme: heading in hoa + chevron, bấm để xổ/bung bảng delivery.
    var accHead = document.createElement("div");
    accHead.className = "fsd-acc-head";
    accHead.innerHTML = '<span class="fsd-acc-title">Estimated Delivery</span>' +
      '<svg class="fsd-acc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
    accHead.addEventListener("click", function () { wrap.classList.toggle("fsd-closed"); });
    var body = document.createElement("div");
    body.className = "fsd-acc-body";
    wrap.appendChild(accHead); wrap.appendChild(body);
    var head = document.createElement("div");
    head.className = "fsd-head";
    var title = document.createElement("p");
    title.className = "fsd-title";
    var sel = document.createElement("select");
    sel.className = "fsd-select";
    COUNTRY_META.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.key; o.textContent = c.label;   // option không nhét ảnh được → chỉ tên nước
      sel.appendChild(o);
    });
    head.appendChild(title); head.appendChild(sel);
    var info = document.createElement("div");
    body.appendChild(head); body.appendChild(info);
    var SVG_CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
    var SVG_TRUCK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 5.5A1.5 1.5 0 0 1 1.5 4h11A1.5 1.5 0 0 1 14 5.5V7h2.02c.44 0 .85.19 1.13.53l2.5 3c.22.27.35.61.35.96V15.5a1.5 1.5 0 0 1-1.5 1.5h-.55a2.75 2.75 0 0 1-5.4 0h-3.1a2.75 2.75 0 0 1-5.4 0H1.5A1.5 1.5 0 0 1 0 15.5v-10ZM14 9v3h4.6l-2.5-3H14ZM6.75 16.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm8.5 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Z"/></svg>';
    var SVG_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    function update() {
      var key = sel.value;
      var meta = COUNTRY_META.filter(function (c) { return c.key === key; })[0];
      var proc = cfg.proc || [1, 3];
      var transit = transitFor(cfg, key);
      var now = new Date();
      var start = (cfg.cutoff != null && now.getHours() >= cfg.cutoff) ? bd(now, 1) : now;
      var shipA = bd(start, proc[0]), shipB = bd(start, proc[1]);
      var delA = bd(start, proc[0] + transit[0]), delB = bd(start, proc[1] + transit[1]);
      title.innerHTML = 'Delivery to ' + flagImg(meta.iso);   // tên nước hiển thị trong chính select — không lặp
      info.innerHTML =
        '<p class="fsd-line">You’ll receive your package between <b>' + fmt(delA) + '</b> - <b>' + fmt(delB) + '</b></p>' +
        '<div class="fsd-steps"><div class="fsd-bar"></div>' +
        '<div class="fsd-step"><span class="fsd-ic">' + SVG_CART + '</span><div class="fsd-step-label">Ordered</div><div class="fsd-step-date">' + fmt(now) + '</div></div>' +
        '<div class="fsd-step"><span class="fsd-ic">' + SVG_TRUCK + '</span><div class="fsd-step-label">Shipped</div><div class="fsd-step-date">' + fmt(shipA) + ' - ' + fmt(shipB) + '</div></div>' +
        '<div class="fsd-step"><span class="fsd-ic">' + SVG_PIN + '</span><div class="fsd-step-label">Delivered</div><div class="fsd-step-date">' + fmt(delA) + ' - ' + fmt(delB) + '</div></div>' +
        '</div>';
    }
    sel.addEventListener("change", update);
    update();
    if (mode === "before") anchor.parentNode.insertBefore(wrap, anchor);
    else anchor.parentNode.insertBefore(wrap, anchor.nextSibling);
    // Canh mép trái/phải THẲNG HÀNG với khối accordion của theme (theme có padding ngang
    // riêng theo breakpoint — đo thực tế rồi bù margin, mọi cỡ màn hình đều thẳng).
    function align() {
      try {
        if (!wrap.isConnected || !anchor.isConnected) return;
        wrap.style.marginLeft = "0px"; wrap.style.marginRight = "0px";
        var a = wrap.getBoundingClientRect(), b = anchor.getBoundingClientRect();
        if (!a.width || !b.width) return;
        wrap.style.marginLeft = (b.left - a.left) + "px";
        wrap.style.marginRight = (a.right - b.right) + "px";
      } catch (e) {}
    }
    align();
    setTimeout(align, 300);   // đo lại sau khi font/ảnh load xong
    var alignT;
    window.addEventListener("resize", function () { clearTimeout(alignT); alignT = setTimeout(align, 150); });
  }

  var fetched = false, cfgCache = null;
  function boot() {
    var m = location.pathname.match(/\/products\/([^\/?#]+)/);
    if (!m) return;   // không phải trang sản phẩm
    hideFallbackText();
    if (!fetched) {
      fetched = true;
      log("boot: handle =", m[1]);
      fetch(FUSION_BASE + "/api/widget/shopbase?handle=" + encodeURIComponent(m[1].toLowerCase()))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          cfgCache = j && j.ok ? j : {};
          log("config loaded:", JSON.stringify({ delivery: !!cfgCache.delivery, customize: (cfgCache.customize || []).length }));
          renderDelivery((cfgCache.delivery) || DEFAULT_DELIVERY);
          renderCustomize(cfgCache.customize || []);
          fillTabs(cfgCache.tabs);
          log("rendered:", JSON.stringify({ delivery: !!document.querySelector(".fsd-wrap"), customize: !!document.querySelector(".fcz-wrap") }));
        })
        .catch(function (e) { log("config fetch FAILED:", String(e)); cfgCache = {}; renderDelivery(DEFAULT_DELIVERY); });
    } else if (cfgCache) {
      renderDelivery((cfgCache.delivery) || DEFAULT_DELIVERY);
      renderCustomize(cfgCache.customize || []);
      fillTabs(cfgCache.tabs);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
  // Theme render trễ (SPA) → thử lại vài nhịp; dừng khi cả 2 widget đã gắn hoặc quá 20 lần.
  var tries = 0;
  var t = setInterval(function () {
    if (++tries > 120) { clearInterval(t); return; }   // canh 60s — theme re-render nuốt widget thì vẽ lại
    var fcz = document.querySelector(".fcz-wrap");
    var done = document.querySelector(".fsd-wrap") && (!cfgCache || !(cfgCache.customize || []).length || (fcz && isVisible(fcz)));
    if (!done) boot();
  }, 500);
})();
</script>
